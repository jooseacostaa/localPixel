<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión | LocalPixel</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: #f4f7fb;
        color: #17233d;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
        margin: 10vh auto;
        padding: 1.5rem;
      }
      h1 {
        line-height: 1.2;
      }
      a {
        display: inline-block;
        padding: 0.65rem 1.15rem;
        border-radius: 0.65rem;
        background: #2458cc;
        color: #fff;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #2458cc;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #101827;
          color: #edf2fa;
        }
        a:focus-visible {
          outline-color: #9dbdff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>LocalPixel</p>
      <h1>Estás sin conexión</h1>
      <p>
        Cuando recuperes la conexión, vuelve al inicio para consultar y
        gestionar tus pedidos.
      </p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
